<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artist Gallery</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
<div class="layout">

    <!-- Left Sidebar -->
    <aside class="sidebar">
        <h1 class="site-title">Artist<br>Portfolio</h1>

        <nav class="menu">
            <button class="menu-btn">Gallery</button>
            <button class="menu-btn">About</button>
            <button class="menu-btn">Contact</button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="content">
        <div id="gallery" class="gallery"></div>
    </main>

</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox hidden">
    <img id="lightbox-img" src="" alt="" />
</div>
<div id="snow-container"></div>

<svg id="snow-ground" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path id="snow-path"></path>
</svg>


<script src="js/gallery.js"></script>

<script>
let lastScrollY = window.scrollY;
const sidebar = document.querySelector('.sidebar');

window.addEventListener('scroll', () => {
    const currentScrollY = window.scrollY;

    // работаем только на мобильных
    if (window.innerWidth <= 768) {
        if (currentScrollY > lastScrollY && currentScrollY > 50) {
            // скролл вниз — скрываем
            sidebar.classList.add('hidden');
        } else {
            // скролл вверх — показываем
            sidebar.classList.remove('hidden');
        }
    }

    lastScrollY = currentScrollY;
});
</script>
<script>
    const svg = document.getElementById("snow-ground");
    const path = document.getElementById("snow-path");

    /* ----------- падение снега ----------- */
    function snowflake() {
        const flake = document.createElement("div");
        flake.className = "snowflake";
        flake.textContent = "❄";

        flake.style.left = Math.random() * window.innerWidth + "px";
        flake.style.fontSize = 10 + Math.random() * 12 + "px";
        flake.style.opacity = Math.random();
        flake.style.animationDuration = 4 + Math.random() * 4 + "s";

        document.body.appendChild(flake);
        setTimeout(() => flake.remove(), 8000);
    }

    setInterval(snowflake, 120);

    /* ----------- рост сугроба ----------- */
    const duration = 10000;
    const start = performance.now();

    function wavePath(height, t) {
        const points = 10;
        let d = `M 0 ${100 - height}`;

        for (let i = 0; i <= points; i++) {
            const x = (i / points) * 100;
            const y =
                100 - height +
                Math.sin(i * 1.3 + t * 0.002) * 2;

            d += ` L ${x} ${y}`;
        }

        d += ` L 100 100 L 0 100 Z`;
        return d;
    }

    function animate(time) {
        const progress = Math.min((time - start) / duration, 1);
        const height = progress * 100;

        svg.style.height = height + "vh";
        path.setAttribute("d", wavePath(height, time));

        if (progress < 1) {
            requestAnimationFrame(animate);
        }
    }

    requestAnimationFrame(animate);
</script>



</body>
</html>
